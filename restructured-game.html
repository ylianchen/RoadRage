<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #333;
        }
        #game-container {
            position: relative;
        }
        canvas {
            max-width: 100%;
            height: auto;
        }
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading-screen">Loading... 0%</div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/utils/AssetLoader.js"></script>
    <script src="js/classes/Animation.js"></script>
    <script src="js/classes/Bonus.js"></script>
    <script src="js/classes/Enemies.js"></script>
    <script src="js/classes/Player.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
